name: daily-scan

# 09:13 UTC, weekdays only. Runs scripts/scan.ts against Neon, then prods
# the Vercel /api/revalidate-research endpoint to bust ISR caches.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   DATABASE_URL              Neon Postgres connection string
#   FINNHUB_API_KEY           server-side Finnhub key (separate from public key)
#   GEMINI_API_KEY            Google Gemini API key for the FactorGrader
#   CRON_SECRET               shared bearer token, must match Vercel env var
# Repository variables:
#   RESEARCH_BASE_URL         e.g. https://portfolio-tracker.vercel.app
# Optional secret (Sentry crons):
#   SENTRY_CRON_HEARTBEAT_URL https://sentry.io/api/0/organizations/.../monitors/.../checkins/

on:
  schedule:
    - cron: "13 09 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without persisting (no DB writes, no revalidate)"
        type: boolean
        default: false

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SENTRY_CRON_HEARTBEAT_URL: ${{ secrets.SENTRY_CRON_HEARTBEAT_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sentry heartbeat — start
        if: env.SENTRY_CRON_HEARTBEAT_URL != ''
        run: |
          curl -fsS -X POST "$SENTRY_CRON_HEARTBEAT_URL" \
            -H "Content-Type: application/json" \
            -d '{"status":"in_progress"}' || true

      - name: Run scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run scan -- --dry-run
          else
            npm run scan
          fi

      - name: Revalidate Vercel ISR
        if: inputs.dry_run != true
        env:
          RESEARCH_BASE_URL: ${{ vars.RESEARCH_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$RESEARCH_BASE_URL" ]; then
            echo "RESEARCH_BASE_URL not set — skipping revalidate (configure in repo vars)"
            exit 0
          fi
          curl -fsS -X POST "$RESEARCH_BASE_URL/api/revalidate-research" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 30

      - name: Sentry heartbeat — success
        if: success() && env.SENTRY_CRON_HEARTBEAT_URL != ''
        run: |
          curl -fsS -X POST "$SENTRY_CRON_HEARTBEAT_URL" \
            -H "Content-Type: application/json" \
            -d '{"status":"ok"}' || true

      - name: Sentry heartbeat — failure
        if: failure() && env.SENTRY_CRON_HEARTBEAT_URL != ''
        run: |
          curl -fsS -X POST "$SENTRY_CRON_HEARTBEAT_URL" \
            -H "Content-Type: application/json" \
            -d '{"status":"error"}' || true
